# enable this with
# tmux source-file ~/.tmux.conf
# NB: You can use CTL-B, then :, and then tmux source-file ~/.tmux.conf

# 1. Faster refresh for real-time branch switching
set -g status-interval 2

# 2. High-contrast colors
# #[bg=red,fg=white] creates a clear 'badge' for the branch name
set -g status-right "#[fg=white,bg=black] %H:%M:%S #[fg=black,bg=yellow] Branch: #[fg=white,bg=red,bold] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'No Repo') "

# 3. Ensure the bar is wide enough for long branch names
set -g status-right-length 100
